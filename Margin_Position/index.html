<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Margin & Position</title>

    <style>
        img {
            width: 200px;
            height: 200px;
            position: absolute;
        }

        .i1 {
            margin: 50px 0 0 50px;
        }

        .i2 {
            margin: 150px 0 0 150px;
        }

        .i3 {
            margin: 250px 0 0 250px;
        }

        div {
            position: absolute;
            margin-left: 800px;
            margin-top: 150px;
            border: 5px solid red;
        }

        button {
            position: relative;
            margin: 20px;
        }
    </style>
</head>

<body>

    <img src="images/tiger.jpg" class="i1">
    <img src="images/baby.webp" class="i2">
    <img src="images/sunset.webp" class="i3">

    <h1>Demo on Margins & Position</h1>

    <div>
        <button>0</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
    </div>

</body>
</html>
